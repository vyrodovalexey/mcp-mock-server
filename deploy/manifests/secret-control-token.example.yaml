# EXAMPLE ONLY — do not apply as-is. The control API mutates the mock and reads
# its journal, so it is token-protected off-loopback (TASK-023, security.md §2.1).
# This file carries a PLACEHOLDER, never a real token. Create the real Secret out
# of band, e.g.:
#
#   kubectl -n mcpmock-test create secret generic mcpmock-control-token \
#     --from-literal=token="$(head -c 32 /dev/urandom | base64)"
#
# then deploy with control enabled (chart: control.enabled=true,
# control.tokenSecretName=mcpmock-control-token). The token is mounted as a FILE
# at /etc/mcpmock/secrets/token and passed via --control-token-file, so it never
# appears in the pod's args or a process listing.
apiVersion: v1
kind: Secret
metadata:
  name: mcpmock-control-token
  namespace: mcpmock-test
  labels:
    app.kubernetes.io/name: mcpmock
    app.kubernetes.io/instance: mcpmock
    app.kubernetes.io/part-of: mcpmock
type: Opaque
stringData:
  # PLACEHOLDER — replace out of band. Never commit a real token.
  token: "REPLACE_ME_WITH_A_RANDOM_TOKEN"
