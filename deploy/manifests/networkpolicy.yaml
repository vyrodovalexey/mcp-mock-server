apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcpmock
  namespace: mcpmock-test
  labels:
    app.kubernetes.io/name: mcpmock
    app.kubernetes.io/instance: mcpmock
    app.kubernetes.io/part-of: mcpmock
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcpmock
      app.kubernetes.io/instance: mcpmock
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # MCP port from same-namespace peers (the hub under test).
    - ports:
        - port: mcp
          protocol: TCP
    # Metrics port from same-namespace peers (Prometheus).
    - ports:
        - port: metrics
          protocol: TCP
  egress:
    # Default-deny egress. mcpmock never fetches remote schemas ("emit but never
    # fetch", GAP-016), so the only allowance is DNS resolution to kube-dns.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
