apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcpmock
  namespace: mcpmock-test
  labels:
    app.kubernetes.io/name: mcpmock
    app.kubernetes.io/instance: mcpmock
    app.kubernetes.io/part-of: mcpmock
    app.kubernetes.io/managed-by: manual
# mcpmock needs no Kubernetes API access: least privilege, no Role/RoleBinding,
# token not auto-mounted.
automountServiceAccountToken: false
