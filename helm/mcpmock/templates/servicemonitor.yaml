{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled -}}
# Optional: requires the Prometheus operator CRDs. Disabled by default so the
# chart installs on a cluster without them.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mcpmock.fullname" . }}
  labels:
    {{- include "mcpmock.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mcpmock.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
