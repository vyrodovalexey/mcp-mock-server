{{- if .Values.control.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpmock.fullname" . }}-control
  labels:
    {{- include "mcpmock.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  type: {{ .Values.control.service.type }}
  selector:
    {{- include "mcpmock.selectorLabels" . | nindent 4 }}
  ports:
    - name: control
      port: {{ .Values.control.port }}
      targetPort: control
      protocol: TCP
{{- end }}
