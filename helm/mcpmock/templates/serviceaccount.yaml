{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcpmock.serviceAccountName" . }}
  labels:
    {{- include "mcpmock.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# mcpmock needs no Kubernetes API access, so no Role/RoleBinding is created and
# the API token is not auto-mounted (least privilege).
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
