apiVersion: mcpmock.dev/v1alpha1
kind: Scenario
metadata:
  name: meta-strict
  description: A scenario selecting strict _meta validation (MOCK-203, AMEND-6).
spec:
  era: modern
  transport:
    kinds: [http]
    http:
      path: /mcp
      listener: shared
  switches:
    validateMeta: strict
  journal:
    enabled: true
    bodies: full
